<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#1554d1">
  <meta name="description" content="Rede Protege Maués — sistema municipal de acompanhamento intersetorial.">
  <title>Detalhes do protocolo | Rede Protege Maués</title>
  <link rel="stylesheet" href="/css/styles.css">
  <script src="https://unpkg.com/lucide@latest" defer></script>
</head>
<body>
  <a class="skip-link" href="#app-main">Ir para o conteúdo</a>
  <div id="app"></div>
  <div id="toast-root" class="toast-root" aria-live="polite"></div>
  <script>
  (function () {
    const params = new URLSearchParams(location.search);
    const id = params.get('id') || params.get('protocolo');
    if (id) location.hash = 'protocol:' + id;
    else if (!location.hash) location.hash = 'protocols';
  })();
</script>
  
  <script type="module" src="/js/app.js"></script>
</body>
</html>
